# Style checks and a subset of the regression test suite on GitHub-hosted runners
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR, but let every push to main finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python style (flake8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install flake8
      - run: python -m flake8

  cpp-lint:
    name: C++ style (cpplint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - working-directory: tst/style
        run: ./check_athena_cpp_style.sh

  regression:
    name: Regression (${{ matrix.os }}, ${{ matrix.cxx }}, ${{ matrix.mpi }})
    needs: [python-lint, cpp-lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
            mpi: openmpi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tst/ci/github/requirements.txt
      - name: Install MPI, FFTW, and HDF5
        run: |
          if [ "${{ matrix.mpi }}" == "openmpi" ]; then MPI_PKGS="libopenmpi-dev openmpi-bin"
          else MPI_PKGS="libmpich-dev mpich"; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $MPI_PKGS libfftw3-dev libhdf5-dev pkg-config
      - name: Install Python dependencies
        run: python -m pip install -r tst/ci/github/requirements.txt
      - name: Run regression tests
        env:
          CXX_CHOICE: ${{ matrix.cxx }}
          MPI_CHOICE: ${{ matrix.mpi }}
        run: ./tst/ci/github/run_tests_github.sh
